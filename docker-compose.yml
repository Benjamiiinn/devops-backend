services:
  backend:
    build: .
    container_name: innovatech_backend
    restart: always
    environment:
      PORT: 3001
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 3306
      DB_NAME: innovatech_ops
      DB_USER: app_user
      DB_PASSWORD: app_secret
      CORS_ORIGIN: "*"
    ports:
      - "3001:3001"